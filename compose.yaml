services:
  nexus:
    image: ${NEXUS_IMAGE}
    restart: unless-stopped
    volumes:
      - nexus-data:/nexus-data
    expose:
      - "8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/service/rest/v1/status || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s

  nginx:
    image: ${NGINX_IMAGE}
    restart: unless-stopped
    depends_on:
      nexus:
        condition: service_healthy
    environment:
      NEXUS_DOMAIN: ${NEXUS_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nexus.conf.template:/etc/nginx/templates/nexus.conf.template:ro
      - ./certs:/etc/nginx/certs:ro

volumes:
  nexus-data:
